  <style>
    :root { --navy: #102e6b; --blue: #2166f3; --sky: #edf4ff; --ink: #132347; --muted: #5d6a85; --line: #e5ebf5; --white: #fff;
      --display: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; --body: 'DM Sans', 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: var(--body); color: var(--ink); background: linear-gradient(180deg, var(--sky), var(--white) 70%);
      display: grid; place-items: center; padding: 32px max(20px, env(safe-area-inset-left)); }
    main { max-width: 520px; text-align: center; display: grid; gap: 18px; justify-items: center; }
    img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 18px 50px rgba(21, 61, 133, .18); }
    h1 { font-family: var(--display); font-size: clamp(30px, 6vw, 42px); letter-spacing: -.035em; margin: 6px 0 0; }
    p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 6px; }
    a.btn { text-decoration: none; font-weight: 700; padding: 14px 22px; border-radius: 14px; }
    a.primary { background: var(--blue); color: var(--white); }
    a.secondary { background: var(--white); color: var(--navy); border: 1px solid var(--line); }
    a.btn:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
    small { color: var(--muted); font-size: 13px; }
  </style>
